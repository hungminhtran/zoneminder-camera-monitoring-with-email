services:
  zoneminder-monitoring:
    build: .
    image: zoneminder-monitoring:local
    container_name: zoneminder-monitoring
    env_file: .env
    environment:
      DB_PATH: /data/zoneminder_monitoring.db
    volumes:
      - ${DB_HOST_DIR:-./data}:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/data?only=status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
