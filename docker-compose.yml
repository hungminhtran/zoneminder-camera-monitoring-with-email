services:
  zoneminder-monitoring:
    build: .
    image: zoneminder-monitoring:local
    container_name: zoneminder-monitoring
    env_file: .env
    environment:
      DB_DIR: /data
      DEV: 0
    volumes:
      - ${DB_HOST_DIR:-./}:/data
    ports:
      - "9080:9080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/api/data?only=status', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
